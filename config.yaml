# ---------------------------------------------------------------------------
# GNN-BERT Music Context Understanding -- central configuration
# Every path is relative to the repository root.
# ---------------------------------------------------------------------------
seed: 42

paths:
  datasets_root: "Datasets"

  # --- FMA (audio + genre/tag metadata) -----------------------------------
  fma_metadata: "Datasets/fma/fma_metadata"
  fma_small: "Datasets/fma/fma_small"
  fma_medium: "Datasets/fma/fma_medium"

  # --- GTZAN (10 genres, 1000 x 30 s wav) ---------------------------------
  gtzan_audio: "Datasets/gtzan/genres_original"
  gtzan_feat30: "Datasets/gtzan/features_30_sec.csv"
  gtzan_feat3: "Datasets/gtzan/features_3_sec.csv"

  # --- MagnaTagATune (188 tags, ~25.8k x 29 s mp3) ------------------------
  mtat_annotations: "Datasets/MagnaTagATune Dataset/annotations_final.csv"
  mtat_audio: "Datasets/MagnaTagATune Dataset/MagnaTagATune"

  # --- MusicCaps (5.5k expert captions; 5'165 x 10 s wav downloaded) ------
  musiccaps_csv: "Datasets/musiccaps/musiccaps-public.csv"
  musiccaps_audio: "Datasets/musiccaps_with_audio/wav"
  musiccaps_downloaded_csv: "Datasets/musiccaps_with_audio/musiccaps-downloaded.csv"
  musiccaps_manifest: "Datasets/musiccaps_with_audio/download_manifest.csv"

  # --- DEAM (valence/arousal + genre metadata) ----------------------------
  deam_audio: "Datasets/Deam_Dataset/MEMD_audio"
  deam_features: "Datasets/Deam_Dataset/features"
  deam_static_1_2000: "Datasets/Deam_Dataset/annotations/annotations averaged per song/song_level/static_annotations_averaged_songs_1_2000.csv"
  deam_static_2000_2058: "Datasets/Deam_Dataset/annotations/annotations averaged per song/song_level/static_annotations_averaged_songs_2000_2058.csv"
  deam_metadata_dir: "Datasets/Deam_Dataset/metadata"

  # --- derived artefacts ---------------------------------------------------
  processed: "data/processed"
  graphs: "data/processed/graphs"
  graph_samples: "data/processed/graph_samples"
  text: "data/processed/text"
  splits: "data/splits"
  results: "results"

# --- audio front-end (Section 3 "Preprocessing pipeline") -------------------
audio:
  sr: 22050
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  n_mfcc: 20
  win_s: 3.0          # segment length (seconds)
  hop_s: 1.5          # segment hop  (50 % overlap)
  max_dur_s: 30.0     # only the first 30 s of a track are used
  max_segments: 24    # hard cap on nodes per graph
  mel_frames: 128     # mel-spectrogram patch width for the CNN baseline

  # Per-dataset overrides -- MusicCaps clips are only 10 s long, so they need a
  # shorter window/hop to yield a graph with a useful number of nodes.
  per_dataset:
    musiccaps:
      win_s: 2.0
      hop_s: 1.0
      max_dur_s: 10.0
      max_segments: 12

# --- graph construction -----------------------------------------------------
graph:
  knn: 5              # similarity edges per node
  sim_threshold: 0.7  # cosine similarity tau
  temporal_radius: 2  # connect segment i to i+1 .. i+radius
  chord_edges: true   # add chord-transition induced edges

# --- text / BERT ------------------------------------------------------------
text:
  model_name: "distilbert-base-uncased"   # or bert-base-uncased
  max_length: 192

# --- task hyper-parameters --------------------------------------------------
# Every task trains for up to `epochs` and stops early once the validation
# metric has not improved for `patience` epochs; `min_epochs` blocks early
# stopping during the initial noisy phase. The best-validation checkpoint is
# always restored before test evaluation.
#
# NOTE on the 20-epoch budget: the GNNs and BERT converge well inside it, but
# the CNN mel baseline (B2) is the slowest learner in the set -- on GTZAN it was
# still climbing at epoch 45 and only reached its 0.80 macro-F1 near epoch 60.
# At 20 epochs it lands nearer 0.60-0.65, so Task 2's graph-vs-CNN margin is
# flattering to the GNNs. Raise task2.epochs (e.g. --epochs 60) for the headline
# baseline table if that comparison matters in the report.
task1:
  epochs: 50
  patience: 5
  min_epochs: 2
  batch_size: 32
  lr: 2.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  top_k_tags: 50

task2:
  epochs: 50
  patience: 5
  min_epochs: 8
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 5.0e-4
  hidden: 128
  layers: 3
  dropout: 0.3
  conv: "sage"        # sage | gat | gcn

task3:
  epochs: 50
  patience: 5
  min_epochs: 2
  batch_size: 16
  lr_bert: 2.0e-5
  lr_other: 1.0e-3
  weight_decay: 0.01
  hidden: 256
  gnn_layers: 3
  n_heads: 4
  alpha: 0.5          # valence loss weight
  beta: 0.5           # arousal loss weight

# Task 4 -- contrastive dual encoder (InfoNCE). A large batch matters here:
# every other item in the batch is a negative, so batch_size sets the difficulty
# of the contrastive problem and the resolution of the R@K metrics.
task4:
  epochs: 50
  patience: 5
  min_epochs: 3
  batch_size: 64
  lr_bert: 2.0e-5
  lr_other: 1.0e-3
  weight_decay: 0.01
  embed_dim: 256
  hidden: 256
  gnn_layers: 3
  temperature: 0.07
